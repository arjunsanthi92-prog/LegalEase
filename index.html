<!DOCTYPE html>
<html>
<head>
    <title>LegalEase</title>
</head>

<body>

    <h1>LegalEase</h1>
    <h2>AI Based Legal Document Generator</h2>

    <p>Create legal documents easily with AI.</p>

    <label>Enter your requirement:</label>
    <br><br>

    <textarea id="requirement" rows="8" cols="50"
        placeholder="Describe your legal document requirement..."></textarea>

    <br><br>

    <button onclick="generateDocument()">Generate Document</button>

    <script>
        function generateDocument() {
            const requirement =
                document.getElementById("requirement").value;

            if (requirement.trim() === "") {
                alert("Please enter your requirement.");
                return;
            }

            alert("Your legal document will be generated here.");
        }
    </script>

</body>
</html>
