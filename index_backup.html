<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LegalEase AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1f3c88;
            font-size: 40px;
        }

        h2 {
            color: #333;
        }

        textarea {
            width: 90%;
            height: 180px;
            padding: 15px;
            font-size: 17px;
            border: 2px solid #ccc;
            border-radius: 10px;
            resize: none;
        }

        button {
            margin: 15px 5px;
            padding: 12px 25px;
            font-size: 16px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }

        #answer {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #eef3ff;
            border-radius: 10px;
            text-align: left;
            line-height: 1.6;
        }

        .warning {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚖️ LegalEase AI</h1>

    <h2>Ask your legal question</h2>

    <textarea id="question"
        placeholder="Type your legal question here..."></textarea>

    <br>

    <button onclick="getAnswer()">Get Answer</button>
    <button onclick="clearQuestion()">Clear</button>

    <div id="answer"></div>

    <p class="warning">
        ⚠️ This is for general legal information only.
        For actual legal advice, consult a qualified lawyer.
    </p>

</div>

<script>

function getAnswer() {

    let question = document.getElementById("question").value.trim();
    let answerBox = document.getElementById("answer");

    if (question === "") {
        alert("Please enter your legal question.");
        return;
    }

    let q = question.toLowerCase();

    let answer = "";

    if (q.includes("rental") || q.includes("rent") || q.includes("lease")) {

        answer = `
        <h3>Rental Agreement</h3>

        <p>
        A rental agreement is a legal agreement between a landlord
        and a tenant that sets out the terms for renting a property.
        </p>

        <p><b>It commonly includes:</b></p>

        <ul>
            <li>Monthly rent</li>
            <li>Security deposit</li>
            <li>Rental period</li>
            <li>Responsibilities of landlord and tenant</li>
            <li>Rules for ending the agreement</li>
        </ul>

        <p>
        The exact rights and obligations can depend on the applicable
        law and the terms of the agreement.
        </p>
        `;

    } else if (q.includes("contract")) {

        answer = `
        <h3>Contract</h3>

        <p>
        A contract is an agreement between two or more parties
        that creates legally enforceable obligations.
        </p>

        <p>
        Important terms can include the parties involved,
        responsibilities, payment, duration and termination conditions.
        </p>
        `;

    } else if (q.includes("divorce")) {

        answer = `
        <h3>Divorce</h3>

        <p>
        Divorce is the legal process of ending a marriage.
        The procedure and requirements depend on the applicable
        personal and family law.
        </p>

        <p>
        For a specific situation, consult a qualified family lawyer.
        </p>
        `;

    } else {

        answer = `
        <h3>LegalEase Response</h3>

        <p>
        Your question: <b>${question}</b>
        </p>

        <p>
        LegalEase can provide general legal information.
        For a specific legal situation, the applicable law,
        location and facts should be considered.
        </p>

        <p>
        Please consult a qualified lawyer for actual legal advice.
        </p>
        `;
    }

    answerBox.innerHTML = answer;
    answerBox.style.display = "block";
}


function clearQuestion() {

    document.getElementById("question").value = "";

    document.getElementById("answer").innerHTML = "";

    document.getElementById("answer").style.display = "none";
}

</script>

</body>
</html>
